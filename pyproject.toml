[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "Real-time semantic search over PubMed abstracts"
requires-python = ">=3.12"
dependencies = []

# Dev tools are added with: uv add --dev ruff mypy pytest pytest-cov pre-commit
# That command creates the [dependency-groups] section for you.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import sorting, UP: modern syntax,
# B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "tests"]
# Libraries without type information (for example confluent-kafka, fastembed)
# will need an override here when they are first imported:
# [[tool.mypy.overrides]]
# module = ["confluent_kafka.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=services --cov-report=term-missing --cov-fail-under=85"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
