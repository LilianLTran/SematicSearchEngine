services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semsearch-postgres
    environment:
      # Local development credentials only. Never reuse these anywhere real.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
